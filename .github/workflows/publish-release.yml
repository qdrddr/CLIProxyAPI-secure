name: Publish Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release name (canonical tag, e.g. v8.0.52-v0.81.0)
        required: true
        type: string
      force_retag:
        description: Move an existing tag to current main and recreate the release
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-release-${{ inputs.release }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish git tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          args=("${{ inputs.release }}")
          if [[ "${{ inputs.force_retag }}" == "true" ]]; then
            args+=(--force)
          fi
          ./scripts/publish-release.sh "${args[@]}"
