name: Release Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: eceasy/cli-proxy-api tag to wrap (e.g. v8.0.47)
        required: true
        type: string

concurrency:
  group: release-docker-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: build
    permissions:
      contents: read
    env:
      DOCKER_IMAGE: bbkudk/cliproxyapi-secure
      NONO_VERSION: "0.80.0"
      DOCKER_PLATFORMS: linux/amd64,linux/arm64
      SKIP_SUBMODULE_CHECKOUT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        run: ./scripts/build-and-push-image.sh "${{ github.event.release.tag_name || inputs.tag }}"
        env:
          DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE || env.DOCKER_IMAGE }}
          NONO_VERSION: ${{ vars.NONO_VERSION || env.NONO_VERSION }}
          DOCKER_PLATFORMS: ${{ vars.DOCKER_PLATFORMS || env.DOCKER_PLATFORMS }}
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          SKIP_SUBMODULE_CHECKOUT: "1"

      - name: Verify manifest platforms
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          IMAGE="${{ vars.DOCKER_IMAGE || env.DOCKER_IMAGE }}:${TAG}"
          docker buildx imagetools inspect "$IMAGE" | tee /tmp/manifest.txt
          grep -q 'linux/amd64' /tmp/manifest.txt
          grep -q 'linux/arm64' /tmp/manifest.txt
