name: Release Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: eceasy/cli-proxy-api tag to wrap (e.g. v8.0.47)
        required: true
        type: string

concurrency:
  group: release-docker-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: build
    permissions:
      contents: read
    env:
      DOCKER_IMAGE: bbkudk/cliproxyapi-secure
      NONO_VERSION: "0.80.0"
      SKIP_SUBMODULE_CHECKOUT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: ./scripts/build-and-push-image.sh "${{ github.event.release.tag_name || inputs.tag }}"
        env:
          DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE || env.DOCKER_IMAGE }}
          NONO_VERSION: ${{ vars.NONO_VERSION || env.NONO_VERSION }}
          SKIP_SUBMODULE_CHECKOUT: "1"
